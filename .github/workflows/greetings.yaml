name: Greetings
on: [pull_request_target, issues]
jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Привет! Спасибо, что обратил внимание на проблему. Мы скоро посмотрим, что можно сделать."
        pr-message: "Ух ты, ты прислал Pull Request! Спасибо за помощь проекту Glitify!"
