name: Close stale issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'Этот Issue не обновлялся 30 дней. Он будет закрыт через 7 дней, если не будет активности.'
          close-issue-message: 'Этот Issue закрыт из-за отсутствия активности.'
          days-before-stale: 30
          days-before-close: 7
